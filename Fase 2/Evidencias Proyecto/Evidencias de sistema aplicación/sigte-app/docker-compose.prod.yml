# Producción: Caddy (HTTPS) + app + Postgres
# docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: sigte-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - sigte
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigte-app
    expose:
      - "80"
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigte
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: sigte-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sigte}
      POSTGRES_USER: ${DB_USERNAME:-sigte}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sigte}
    volumes:
      - sigte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sigte
    restart: unless-stopped

networks:
  sigte:
    driver: bridge

volumes:
  sigte_pgdata:
  caddy_data:
  caddy_config:
